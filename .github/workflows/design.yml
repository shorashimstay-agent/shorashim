name: Design push

# The designer's Codex agent pushes her work to the `design` branch (scripts/ship.mjs). This checks
# it and, when it changes design files only, merges it into main and deploys it. A push that touches
# a file in .github/CODEOWNERS waits on its pull request for the owner (docs/designer-pipeline.md).

on:
  push:
    branches: [design]

permissions:
  contents: read

concurrency:
  group: design
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Push protection is the first net; this stops a key that slipped past it from going live.
      - name: Scan the new commits for secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --log-opts "origin/main..HEAD" .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            src/assets/images/optimized
            public/og-image.jpg
          key: images-${{ hashFiles('src/assets/images/*.jpg', 'scripts/optimize-images.mjs') }}

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Check the page, the booking form and accessibility
        run: npx playwright test -c playwright.ci.config.ts
      - name: Check the design contract and prices
        run: node scripts/design-contract.mjs .ci-dist

  ship:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      SUBJECT: ${{ github.event.head_commit.message }}
    steps:
      # The rules come from main, so a push cannot loosen them for itself.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge into main, or leave it for the owner
        run: |
          git fetch -q origin "$SHA"
          locked=$(git diff --name-only "origin/main...$SHA" | node scripts/locked-files.mjs)
          pr=$(gh pr list --head design --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --head design --base main --title "Design: ${SUBJECT%%$'\n'*}" \
              --body "Pushed by the designer's Codex agent (docs/designer-pipeline.md). Design-only changes merge on their own; this PR stays open only if it touches files in .github/CODEOWNERS."
            pr=$(gh pr list --head design --base main --state open --json number --jq '.[0].number')
          fi
          if [ -n "$locked" ]; then
            { echo "Waiting for the owner: #$pr changes files reserved in .github/CODEOWNERS:"; echo "$locked" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$pr" --rebase --match-head-commit "$SHA"
          # A merge made with this token starts no workflows, so the deploy is started explicitly.
          gh workflow run deploy.yml --ref main
          echo "Merged #$pr and started the deploy." >> "$GITHUB_STEP_SUMMARY"
