name: Deploy site

# Every push to main deploys, and so does the design pipeline after it merges (design.yml). Only main
# can deploy: the github-pages environment accepts no other branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Re-encoding the photos takes about three minutes; they only change when a master does.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            src/assets/images/optimized
            public/og-image.jpg
          key: images-${{ hashFiles('src/assets/images/*.jpg', 'scripts/optimize-images.mjs') }}

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check that the live site serves this build
        run: node scripts/live-check.mjs
